<rect x="52" y="128" width="44" height="128" fill="#216baa"/>
<g stroke="#eef5fc" stroke-width="4"><line x1="96" y1="128" x2="96" y2="256"/><line x1="131" y1="128" x2="131" y2="256"/><line x1="166" y1="128" x2="166" y2="256"/><line x1="201" y1="128" x2="201" y2="256"/></g>
<rect x="64" y="200" width="20" height="56" rx="3" fill="#f2c14e"/>
