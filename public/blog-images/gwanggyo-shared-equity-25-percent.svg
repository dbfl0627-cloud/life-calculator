<text x="318" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#0d4177" font-family="system-ui, -apple-system, sans-serif">입주 때</text>
<text x="318" y="158" text-anchor="middle" font-size="48" font-weight="900" fill="#216baa" font-family="system-ui, -apple-system, sans-serif">25%</text>
<rect x="262" y="190" width="112" height="40" rx="20" fill="#0b2545"/>
<text x="318" y="216" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="system-ui, -apple-system, sans-serif">75%는 20년</text>
